```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T2A GAME STUDİO | Hesap</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #e8edf7;
      background:
        radial-gradient(ellipse at top, #203a57 0%, transparent 55%),
        #0b1018;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #34445b;
      border-radius: 18px;
      background: rgba(19, 28, 42, .96);
      box-shadow: 0 20px 70px #0008;
    }

    .logo {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span { color: #56a0ff; }

    .subtitle {
      margin: 0 0 26px;
      color: #a9b7ca;
      text-align: center;
      line-height: 1.5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    button, input { font: inherit; }

    .tab, .submit, .logout {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .tab {
      color: #bdc8d8;
      background: #202c3d;
    }

    .tab.active {
      color: white;
      background: #276fd0;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: #d6dfeb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #0d1521;
      border: 1px solid #394960;
      border-radius: 9px;
      outline: none;
    }

    input:focus { border-color: #56a0ff; }

    .submit, .logout {
      width: 100%;
      margin-top: 22px;
      color: white;
      background: #2878e7;
      font-weight: bold;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error { color: #ff8e96; }
    .message.success { color: #7ce4ac; }

    .hidden { display: none !important; }

    .account {
      text-align: center;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 20px auto;
      border-radius: 50%;
      background: #233d5c;
      color: #83baff;
      font-size: 32px;
    }

    .email {
      overflow-wrap: anywhere;
      color: #9fbedf;
    }

    .logout { background: #34445a; }

    .note {
      margin-top: 22px;
      color: #8292a8;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="logo">T2A GAME <span>STUDİO</span></h1>
    <p class="subtitle">Oyun dünyasına katıl.</p>

    <section id="authSection">
      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">Giriş Yap</button>
        <button id="registerTab" class="tab" type="button">Kayıt Ol</button>
      </div>

      <form id="authForm">
        <label for="email">E-posta adresi</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="ornek@email.com"
          required
        >

        <label for="password">Şifre (en az 6 karakter)</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          placeholder="Şifren"
          required
        >

        <button id="submitButton" class="submit" type="submit">
          Giriş Yap
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <section id="accountSection" class="account hidden">
      <div class="avatar">✓</div>
      <h2>Hoş geldin!</h2>
      <p>Hesabınla giriş yaptın.</p>
      <p id="accountEmail" class="email"></p>
      <button id="logoutButton" class="logout" type="button">
        Çıkış Yap
      </button>
      <div id="accountMessage" class="message" role="status"></div>
    </section>

    <p class="note">
      Hesabın Firebase Authentication ile yönetilir.
      Şifren bu sayfada saklanmaz.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    // Firebase Console > Project settings > Your apps > Config
    // Kendi proje bilgilerinle değiştir.
    const firebaseConfig = {
      apiKey: "AIzaSyAl1iMlEFRSFAoFP_nWL1lGjeVuoqY8F8g",
      authDomain: "t2a-game-studio.firebaseapp.com",
      projectId: "t2a-game-studio",
      storageBucket: "t2a-game-studio.firebasestorage.app",
      messagingSenderId: "284781981543",
      appId: "1:284781981543:web:994dc99cef0142a97489c2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authSection = document.getElementById("authSection");
    const accountSection = document.getElementById("accountSection");
    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const accountMessage = document.getElementById("accountMessage");
    const accountEmail = document.getElementById("accountEmail");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const logoutButton = document.getElementById("logoutButton");

    let mode = "login";
    let busy = false;

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setMode(newMode) {
      mode = newMode;
      const registering = mode === "register";

      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);
      submitButton.textContent = registering ? "Hesap Oluştur" : "Giriş Yap";
      passwordInput.autocomplete =
        registering ? "new-password" : "current-password";

      showMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    function friendlyError(error) {
      const messages = {
        "auth/email-already-in-use": "Bu e-posta adresiyle zaten hesap var.",
        "auth/invalid-email": "E-posta adresi geçerli değil.",
        "auth/weak-password": "Daha güçlü bir şifre belirle.",
        "auth/invalid-credential": "E-posta veya şifre hatalı.",
        "auth/user-not-found": "Bu e-posta ile kayıtlı hesap bulunamadı.",
        "auth/wrong-password": "Şifre hatalı.",
        "auth/too-many-requests": "Çok fazla deneme yapıldı. Bir süre sonra tekrar dene.",
        "auth/network-request-failed": "İnternet bağlantını kontrol et.",
        "auth/operation-not-allowed": "Firebase'de Email/Password girişini kontrol et.",
        "auth/unauthorized-domain": "GitHub Pages alan adını Firebase Authorized domains bölümüne ekle.",
        "auth/configuration-not-found": "Firebase Authentication ayarlarını kontrol et."
      };

      return messages[error.code] ||
        "İşlem başarısız oldu. Firebase ayarlarını kontrol et. (" +
        (error.code || "bilinmeyen hata") + ")";
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      busy = true;
      submitButton.disabled = true;
      showMessage(mode === "register" ? "Hesap oluşturuluyor..." : "Giriş yapılıyor...", "success");

      try {
        if (mode === "register") {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        busy = false;
        submitButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      accountMessage.textContent = "";

      try {
        await signOut(auth);
      } catch (error) {
        accountMessage.textContent = "Çıkış yapılamadı. Tekrar dene.";
      } finally {
        logoutButton.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.classList.add("hidden");
        accountSection.classList.remove("hidden");
        accountEmail.textContent = user.email || "";
      } else {
        accountSection.classList.add("hidden");
        authSection.classList.remove("hidden");
        emailInput.value = "";
        passwordInput.value = "";
        setMode("login");
      }
    });
  </script>
</body>
</html>
