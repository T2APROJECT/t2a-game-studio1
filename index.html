
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T2A GAME STUDIO | Giriş</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1018;color:#edf3ff;font-family:Arial,sans-serif}
main{width:100%;max-width:460px;background:#131c2a;border:1px solid #34445b;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0008}
h1{text-align:center;font-size:27px}h1 span{color:#56a0ff}.sub{color:#a9b7ca;text-align:center;line-height:1.5}
.tabs{display:flex;gap:8px;margin:20px 0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:12px;color:white;background:#263449}button:disabled{opacity:.6;cursor:wait}
.tabs button{flex:1}.active,.primary{background:#2878e7}.primary,.secondary,.provider{width:100%;margin-top:10px;font-weight:bold}
.secondary{background:#34445a}.provider{border:1px solid #3b4b60}.field{margin:12px 0}.field label{display:block;margin-bottom:7px;font-size:14px;color:#d6dfeb}
input{width:100%;padding:12px;background:#0d1521;color:white;border:1px solid #394960;border-radius:8px;outline:none}input:focus{border-color:#56a0ff}
.msg{font-size:14px;line-height:1.6;overflow-wrap:anywhere;margin-top:14px;color:#ff9ba3}.ok{color:#7ce4ac}.hidden{display:none!important}.note{font-size:12px;color:#8292a8;line-height:1.5;text-align:center;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>T2A GAME <span>STUDIO</span></h1>
<p class="sub">Oyun dünyasına katıl.</p>
<p id="loading" class="sub">Oturum kontrol ediliyor...</p>
<section id="auth" class="hidden">
<div class="tabs"><button id="loginTab" class="active">Giriş Yap</button><button id="registerTab">Kayıt Ol</button></div>
<form id="form">
<div id="profile" class="hidden">
<div class="field"><label for="first">Adın</label><input id="first" maxlength="40" autocomplete="given-name"></div>
<div class="field"><label for="last">Soyadın</label><input id="last" maxlength="40" autocomplete="family-name"></div>
<div class="field"><label for="nick">Oyuncu adı</label><input id="nick" minlength="3" maxlength="20" autocomplete="nickname"></div>
</div>
<div class="field"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Şifre (en az 6 karakter)</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div>
<button id="submit" class="primary" type="submit">Giriş Yap</button>
</form>
<hr style="border-color:#34445b;margin-top:22px">
<button id="google" class="provider">Google ile devam et</button>
<button id="github" class="provider">GitHub ile devam et</button>
<button id="guest" class="provider">Misafir olarak devam et</button>
<p id="msg" class="msg" role="status" aria-live="polite"></p>
</section>
<section id="verify" class="hidden">
<h2>E-postanı doğrula</h2><p class="sub" id="verifyText"></p>
<button id="resend" class="primary">Doğrulama e-postasını tekrar gönder</button>
<button id="check" class="secondary">Doğrulamayı kontrol et</button>
<button id="verifyOut" class="secondary">Çıkış yap</button>
<p id="verifyMsg" class="msg"></p>
</section>
<section id="account" class="hidden">
<h2 id="welcome">Hoş geldin!</h2><p id="accountText" class="sub"></p>
<button id="store" class="primary">Oyun mağazasına git</button>
<button id="accountPage" class="secondary">Hesap ayarları</button>
<button id="permanent" class="secondary hidden">Kalıcı hesap oluştur</button>
<button id="logout" class="secondary">Çıkış yap</button>
<p id="accountMsg" class="msg"></p>
</section>
<p class="note">Hesap güvenliği Firebase Authentication tarafından yönetilir.</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInAnonymously,signInWithRedirect,getRedirectResult,GoogleAuthProvider,GithubAuthProvider,sendEmailVerification,updateProfile,signOut,reload}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const app=initializeApp({
 apiKey:"AIzaSyAl1iMlEFRSFAoFP_nWL1lGjeVuoqY8F8g",
 authDomain:"t2a-game-studio.firebaseapp.com",
 projectId:"t2a-game-studio",
 storageBucket:"t2a-game-studio.firebasestorage.app",
 messagingSenderId:"284781981543",
 appId:"1:284781981543:web:994dc99cef0142a97489c2"
});
const auth=getAuth(app),$=id=>document.getElementById(id);
let mode=new URLSearchParams(location.search).get("mode")==="register"?"register":"login",busy=false;

function msg(id,text,ok=false){$(id).textContent=text;$(id).className="msg"+(ok?" ok":"")}
function screen(name){$("loading").classList.add("hidden");["auth","verify","account"].forEach(id=>$(id).classList.toggle("hidden",id!==name))}
function setMode(m){mode=m;let reg=m==="register";$("loginTab").classList.toggle("active",!reg);$("registerTab").classList.toggle("active",reg);$("profile").classList.toggle("hidden",!reg);["first","last","nick"].forEach(id=>$(id).required=reg);$("password").autocomplete=reg?"new-password":"current-password";$("submit").textContent=reg?"Hesap oluştur":"Giriş yap";msg("msg","")}
function errorText(e){
 const m={
 "auth/unauthorized-domain":"Firebase Authorized domains bölümüne t2aproject.github.io ekle.",
 "auth/operation-not-allowed":"Firebase Authentication bölümünde bu giriş sağlayıcısını etkinleştir.",
 "auth/popup-closed-by-user":"Giriş penceresi kapandı. Redirect yöntemini kullandığımızdan sayfayı yenileyip tekrar dene.",
 "auth/redirect-cancelled-by-user":"Giriş iptal edildi.",
 "auth/account-exists-with-different-credential":"Bu e-posta başka bir giriş yöntemiyle kayıtlı. Önce o yöntemle giriş yap.",
 "auth/email-already-in-use":"Bu e-posta ile zaten bir hesap var.",
 "auth/invalid-credential":"E-posta veya şifre hatalı.",
 "auth/weak-password":"En az 6 karakterli bir şifre gir.",
 "auth/invalid-email":"E-posta adresini kontrol et.",
 "auth/network-request-failed":"İnternet bağlantını kontrol et.",
 "auth/too-many-requests":"Çok fazla deneme yapıldı. Biraz sonra tekrar dene.",
 "auth/unauthorized-continue-uri":"Yönlendirme adresi Firebase tarafından yetkilendirilmemiş."
 };
 return (m[e.code]||"Firebase hata kodu: "+(e.code||"bilinmeyen")+" — "+(e.message||"Ayrıntı yok"));
}
async function updateScreen(user){
 if(!user){screen("auth");return}
 if(user.isAnonymous){
  screen("account");$("welcome").textContent="Misafir olarak hoş geldin!";$("accountText").textContent="Mağazayı gezebilirsin. Satın alma işlemleri için kalıcı hesap gerekir.";$("permanent").classList.remove("hidden");return;
 }
 try{
  await reload(user);
  const social=user.providerData.some(p=>["google.com","github.com"].includes(p.providerId));
  if(!user.emailVerified&&!social){
   screen("verify");$("verifyText").textContent="Doğrulama bağlantısını şu adrese gönderdik: "+(user.email||"");return;
  }
  screen("account");$("welcome").textContent="Hoş geldin, "+(localStorage.getItem("t2a_nick_"+user.uid)||user.displayName||"Oyuncu")+"!";
  $("accountText").textContent=user.email||"E-posta sağlayıcı tarafından paylaşılmadı";$("permanent").classList.add("hidden");
 }catch(e){screen("auth");msg("msg",errorText(e))}
}
$("loginTab").onclick=()=>setMode("login");$("registerTab").onclick=()=>setMode("register");
$("form").addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;busy=true;$("submit").disabled=true;
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(mode==="register"){
   const first=$("first").value.trim(),last=$("last").value.trim(),nick=$("nick").value.trim();
   if(!first||!last||nick.length<3)throw new Error("Ad, soyad ve en az 3 karakterli nick gir.");
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(cred.user,{displayName:first+" "+last});
   localStorage.setItem("t2a_nick_"+cred.user.uid,nick);
   await sendEmailVerification(cred.user);
   screen("verify");$("verifyText").textContent="Doğrulama e-postası gönderildi: "+email;
  }else{await signInWithEmailAndPassword(auth,email,password)}
 }catch(e){msg("msg",errorText(e))}finally{busy=false;$("submit").disabled=false}
});
async function redirectLogin(provider){
 if(busy)return;busy=true;msg("msg","Giriş sayfasına yönlendiriliyorsun...",true);
 try{await signInWithRedirect(auth,provider)}catch(e){busy=false;msg("msg",errorText(e))}
}
$("google").onclick=()=>redirectLogin(new GoogleAuthProvider());
$("github").onclick=()=>redirectLogin(new GithubAuthProvider());
$("guest").onclick=async()=>{try{await signInAnonymously(auth)}catch(e){msg("msg",errorText(e))}};
$("resend").onclick=async()=>{try{if(auth.currentUser)await sendEmailVerification(auth.currentUser);msg("verifyMsg","Doğrulama e-postası gönderildi.",true)}catch(e){msg("verifyMsg",errorText(e))}};
$("check").onclick=async()=>{try{await reload(auth.currentUser);if(auth.currentUser.emailVerified)await updateScreen(auth.currentUser);else msg("verifyMsg","E-posta henüz doğrulanmamış. Bağlantıya tıkla ve tekrar dene.")}catch(e){msg("verifyMsg",errorText(e))}};
async function logout(){await signOut(auth);location.replace("./index.html")}
$("logout").onclick=logout;$("verifyOut").onclick=logout;
$("store").onclick=()=>location.href="./store.html";
$("accountPage").onclick=()=>location.href="./account.html";
$("permanent").onclick=async()=>{try{await signOut(auth);location.href="./index.html?mode=register"}catch(e){msg("accountMsg",errorText(e))}};
try{await getRedirectResult(auth)}catch(e){msg("msg",errorText(e))}
onAuthStateChanged(auth,user=>{updateScreen(user).catch(e=>msg("msg",errorText(e)))});
setMode(mode);
</script>
</body>
</html>
